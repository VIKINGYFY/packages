name: 每日检查并更新 MiniUPnP 核心

on:
  workflow_dispatch:
    inputs:
      build_apks:
        description: 更新后编译并发布 APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      build_apks:
        description: 是否在此工作流内编译并发布 APK
        required: false
        default: true
        type: boolean
    outputs:
      package_changed:
        description: MiniUPnP 软件包是否发生变更
        value: ${{ jobs.update.outputs.package_changed }}
      packages:
        description: 需要编译的软件包目录
        value: ${{ jobs.update.outputs.packages }}
      source_sha:
        description: 更新后的精确提交 SHA
        value: ${{ jobs.update.outputs.source_sha }}

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  update:
    name: 检查并更新 MiniUPnP 核心
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_changed: ${{ steps.package_commit.outputs.changed }}
      packages: ${{ steps.package_commit.outputs.packages }}
      source_sha: ${{ steps.package_commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出软件包仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步默认分支
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 检查 MiniUPnP 上游提交
        id: upstream
        run: |
          makefile='miniupnpd/Makefile'
          upstream_branch='master'
          upstream_commit="$(git ls-remote \
            https://github.com/miniupnp/miniupnp.git \
            "refs/heads/$upstream_branch" | cut -f1)"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]

          current_commit="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$makefile")"
          changed=true
          if [[ "$current_commit" == "$upstream_commit" ]]; then
            changed=false
            echo "MiniUPnP 上游无更新：$upstream_commit"
          fi

          {
            echo "changed=$changed"
            echo "commit=$upstream_commit"
          } >> "$GITHUB_OUTPUT"

      - name: 下载并校验 MiniUPnP 源码与补丁
        if: steps.upstream.outputs.changed == 'true'
        id: source
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          archive="$RUNNER_TEMP/miniupnpd.tar.gz"
          source_dir="$RUNNER_TEMP/miniupnpd-source"
          curl -fL --retry 3 \
            "https://codeload.github.com/miniupnp/miniupnp/tar.gz/$UPSTREAM_COMMIT" \
            -o "$archive"
          tar -tzf "$archive" >/dev/null
          mkdir -p "$source_dir"
          tar -xzf "$archive" --strip-components=1 -C "$source_dir"
          test -x "$source_dir/miniupnpd/configure"
          test -s "$source_dir/miniupnpd/upnpredirect.c"
          test -s "$source_dir/miniupnpd/miniupnpd.c"

          for patch_file in miniupnpd/patches/*.patch; do
            [[ -f "$patch_file" ]] || continue
            patch --batch --forward --fuzz=0 -p1 -d "$source_dir" < "$patch_file"
          done

          echo "hash=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 更新 MiniUPnP 软件包元数据
        if: steps.upstream.outputs.changed == 'true'
        env:
          SOURCE_HASH: ${{ steps.source.outputs.hash }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          makefile='miniupnpd/Makefile'
          package_version="$(TZ=Asia/Shanghai date +%Y%m%d)"
          current_version="$(sed -n 's/^PKG_VERSION:=//p' "$makefile")"
          current_release="$(sed -n 's/^PKG_RELEASE:=//p' "$makefile")"
          release=1
          if [[ "$current_version" == "$package_version" ]]; then
            [[ "$current_release" =~ ^[0-9]+$ ]]
            release=$((current_release + 1))
          fi

          sed -i \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=$package_version/" \
            -e "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$release/" \
            -e "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$UPSTREAM_COMMIT/" \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=$SOURCE_HASH/" \
            "$makefile"

          grep -Fx "PKG_VERSION:=$package_version" "$makefile"
          grep -Fx "PKG_RELEASE:=$release" "$makefile"
          grep -Fx "PKG_SOURCE_VERSION:=$UPSTREAM_COMMIT" "$makefile"
          grep -Fx "PKG_HASH:=$SOURCE_HASH" "$makefile"
          git diff --check

      - name: 提交 MiniUPnP 更新
        if: steps.upstream.outputs.changed == 'true'
        id: package_commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          makefile='miniupnpd/Makefile'
          package_version="$(sed -n 's/^PKG_VERSION:=//p' "$makefile")"
          release="$(sed -n 's/^PKG_RELEASE:=//p' "$makefile")"
          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            "chore: 更新 MiniUPnP 至 ${package_version}-r${release}" \
            "$makefile"

  build:
    name: 编译并发布 MiniUPnP 核心 APK
    needs: update
    if: >-
      always() && needs.update.outputs.package_changed == 'true' &&
      inputs.build_apks
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.update.outputs.source_sha }}
      packages: miniupnpd
