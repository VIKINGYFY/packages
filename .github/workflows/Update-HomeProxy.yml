name: 每日检查并更新 HomeProxy 数据

on:
  workflow_dispatch:
    inputs:
      build_apks:
        description: 更新后编译并发布 APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      build_apks:
        description: 是否在此工作流内编译并发布 APK
        required: false
        default: true
        type: boolean
    outputs:
      package_changed:
        description: HomeProxy 软件包是否发生变更
        value: ${{ jobs.update.outputs.package_changed }}
      packages:
        description: 需要编译的软件包目录
        value: ${{ jobs.update.outputs.packages }}
      source_sha:
        description: 更新后的精确提交 SHA
        value: ${{ jobs.update.outputs.source_sha }}

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  update:
    name: 检查并更新 HomeProxy 数据
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_changed: ${{ steps.package_commit.outputs.changed }}
      packages: ${{ steps.package_commit.outputs.packages }}
      source_sha: ${{ steps.package_commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步默认分支
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 安装数据更新工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends curl jq unzip

      - name: 检查并更新 HomeProxy 数据
        id: resources
        run: .github/scripts/update-homeproxy-geodata.sh

      - name: 提交数据更新
        id: package_commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
          RESOURCE_VERSION: ${{ steps.resources.outputs.version }}
        run: |
          source .github/scripts/ci-common.sh
          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            "chore: 更新 HomeProxy 数据至 $RESOURCE_VERSION" \
            luci-app-homeproxy/root/etc/homeproxy/resources \
            luci-app-homeproxy/root/etc/homeproxy/dashboard

  build:
    name: 编译并发布 HomeProxy APK
    needs: update
    if: >-
      always() && needs.update.outputs.package_changed == 'true' &&
      inputs.build_apks
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.update.outputs.source_sha }}
      packages: luci-app-homeproxy
