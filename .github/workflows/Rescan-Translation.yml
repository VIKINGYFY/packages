name: 每日维护插件说明、翻译与权限

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: 维护插件说明、翻译与权限
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_changed: ${{ steps.maintenance_commit.outputs.changed }}
      packages: ${{ steps.maintenance_commit.outputs.packages }}
      source_sha: ${{ steps.maintenance_commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步默认分支
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 安装翻译工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends gettext

      - name: 维护插件说明、翻译与权限
        run: |
          .github/scripts/maintain-repository.sh
          .github/scripts/rescan-translations.sh
          git diff --check

      - name: 提交维护结果
        id: maintenance_commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            'chore: 维护插件说明、翻译与权限' \
            .

  build:
    name: 编译受维护影响的 APK
    needs: maintain
    if: always() && needs.maintain.outputs.package_changed == 'true' && needs.maintain.outputs.packages != ''
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.maintain.outputs.source_sha }}
      packages: ${{ needs.maintain.outputs.packages }}
