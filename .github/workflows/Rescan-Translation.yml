name: 每日维护插件说明、翻译与权限

on:
  workflow_dispatch:
    inputs:
      build_apks:
        description: 维护后编译并发布 APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      build_apks:
        description: 是否在此工作流内编译并发布 APK
        required: false
        default: true
        type: boolean
    outputs:
      package_changed:
        description: 软件包是否发生变更
        value: ${{ jobs.maintain.outputs.package_changed }}
      packages:
        description: 需要编译的软件包目录
        value: ${{ jobs.maintain.outputs.packages }}
      source_sha:
        description: 维护后的精确提交 SHA
        value: ${{ jobs.maintain.outputs.source_sha }}

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: 维护插件说明、翻译与权限
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_changed: ${{ steps.maintenance_commit.outputs.changed }}
      packages: ${{ steps.maintenance_commit.outputs.packages }}
      source_sha: ${{ steps.maintenance_commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步默认分支
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 安装翻译工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends gettext

      - name: 维护插件说明、翻译与权限
        run: |
          .github/scripts/maintain-repository.sh
          .github/scripts/rescan-translations.sh
          git diff --check

      - name: 提交维护结果
        id: maintenance_commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            'chore: 维护插件说明、翻译与权限' \
            .

  build:
    name: 编译受维护影响的 APK
    needs: maintain
    if: >-
      always() && needs.maintain.outputs.package_changed == 'true' &&
      needs.maintain.outputs.packages != '' && inputs.build_apks
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.maintain.outputs.source_sha }}
      packages: ${{ needs.maintain.outputs.packages }}
